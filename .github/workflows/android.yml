name: Android app (Google Play)

# Builds a signed Android App Bundle (.aab) of the TWA for Google Play.
# Run it from the Actions tab → "Android app (Google Play)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'Version code: must be higher than the last upload'
        required: true
        default: '101'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install Bubblewrap core
        run: |
          mkdir -p "$RUNNER_TEMP/bw"
          cd "$RUNNER_TEMP/bw"
          npm init -y >/dev/null
          npm i @bubblewrap/core@1.27.0
          cp "$GITHUB_WORKSPACE/scripts/twa/generate.mjs" .

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/android.keystore"
          test -s "$RUNNER_TEMP/android.keystore"

      - name: Show upload key fingerprint (public, compare with Play Console)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          K="$RUNNER_TEMP/android.keystore"
          echo "Keystore size: $(stat -c %s "$K") bytes, type: $(file -b "$K")"
          echo "Alias length: ${#KEY_ALIAS}, store password length: ${#KEYSTORE_PASSWORD}"
          if ! keytool -list -keystore "$K" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kl.txt" 2>&1; then
            echo "Cannot open keystore (wrong KEYSTORE_PASSWORD or broken KEYSTORE_BASE64):"
            grep -i 'error' "$RUNNER_TEMP/kl.txt" | head -3; exit 1
          fi
          echo "Aliases in keystore:"; grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/kl.txt" | cut -d, -f1
          keytool -list -v -keystore "$K" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA256:' || { echo "Alias not found: check KEY_ALIAS"; exit 1; }

      - name: Generate Android project
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: node "$RUNNER_TEMP/bw/generate.mjs" "$GITHUB_WORKSPACE/twa"

      - name: Build bundle
        working-directory: twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p dist
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/android.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar "dist/hesham-$VERSION_NAME-$VERSION_CODE.aab" \
            twa/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify "dist/hesham-$VERSION_NAME-$VERSION_CODE.aab" | tail -1

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/android.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: hesham-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist/*.aab
          retention-days: 30
