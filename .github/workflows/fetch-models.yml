name: Fetch on-device photo models

# One-off: downloads the MediaPipe models used by the white-background photo tool
# (they run in the user's browser; photos never leave the phone) and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download models
        run: |
          mkdir -p vendor/mediapipe/models
          cd vendor/mediapipe/models
          curl -fsSL -o selfie_segmenter.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite
          curl -fsSL -o face_detector.tflite https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite
          ls -la
          sha256sum *.tflite
      - name: Commit
        run: |
          git config user.name HushamAhmed90
          git config user.email HushamAhmed90@users.noreply.github.com
          git add vendor/mediapipe/models
          git commit -m "Add on-device MediaPipe models for the photo tool" || echo "nothing to commit"
          git push
